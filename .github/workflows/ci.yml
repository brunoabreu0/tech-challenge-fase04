name: CI — Lint, Test, Drift Audit & Build

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint (Ruff)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Run Ruff Linting
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

  # ---------------------------------------------------------------------------
  # Job 2: Test (Pytest) + Data Contracts & Drift Reports Verification
  # ---------------------------------------------------------------------------
  test:
    name: Test (Pytest & Evidently Reports)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install --with dev

      - name: Run Tests with Coverage (>= 80%)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: poetry run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

      - name: Run Data Contracts, Model Training & Evidently Drift Pipeline
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          PYTHONPATH=src poetry run python scripts/validate_data.py
          PYTHONPATH=src poetry run python scripts/train.py
          PYTHONPATH=src poetry run python scripts/run_drift_analysis.py

      - name: Upload Evidently Drift & Data Contract Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fase04-drift-and-contract-reports
          path: reports/

  # ---------------------------------------------------------------------------
  # Job 3: Build Docker Image (apenas push para main)
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (and Push if Docker Hub secrets configured)
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "ℹ️ Secrets DOCKERHUB_USERNAME/DOCKERHUB_TOKEN não configurados; validando build local da imagem Docker..."
            docker build -t credit-guard-api:latest .
            echo "✅ Imagem Docker credit-guard-api:latest construída com sucesso!"
            exit 0
          fi

          for i in 1 2 3 4 5; do
            echo "Tentativa $i: autenticando no Docker Hub..."
            if echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin; then
              echo "✅ Autenticado com sucesso no Docker Hub."
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "❌ Falha ao autenticar no Docker Hub após 5 tentativas."
              exit 1
            fi
            sleep $((i * 5))
          done

          docker buildx build \
            --push \
            -t "${DOCKERHUB_USERNAME}/credit-guard-api:latest" \
            -t "${DOCKERHUB_USERNAME}/credit-guard-api:${GITHUB_SHA}" \
            .

  # ---------------------------------------------------------------------------
  # Job 4: Continuous Deployment (EC2 via AWS SSM)
  # ---------------------------------------------------------------------------
  deploy:
    name: Continuous Deployment (AWS SSM)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: sa-east-1
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Deploy via AWS Systems Manager (SSM)
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "ℹ️ Secrets AWS não configurados no repositório. Pulando deploy SSM."
            exit 0
          fi

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region sa-east-1 \
            --filters "Name=tag:Name,Values=*credit-guard*api-server,credit-guard-fase04-api-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" == "None" ]; then
            echo "⚠️ Nenhuma instância EC2 ativa encontrada. Pulando deploy automático."
            exit 0
          fi

          COMMAND_ID=$(aws ssm send-command \
            --region sa-east-1 \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "CI/CD Auto-Deploy Fase 4 via GitHub Actions" \
            --parameters 'commands=[
              "set -euxo pipefail",
              "cd /opt/credit-guard/repo",
              "git pull --ff-only origin main",
              "docker compose -f docker-compose.prod.yml pull || true",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "sleep 8",
              "curl -s -f http://localhost:8000/health",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --region sa-east-1 \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true

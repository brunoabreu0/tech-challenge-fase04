name: Deploy Infrastructure (Terraform)

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-infra.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform a executar (plan, apply ou destroy)"
        required: true
        default: "apply"
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'apply' }}
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: sa-east-1
      TF_ACTION: ${{ github.event.inputs.action || 'apply' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.x"
          terraform_wrapper: false

      - name: Verify AWS Credentials
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ Configure os secrets AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY no repositório GitHub."
            exit 1
          fi

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        if: env.TF_ACTION != 'destroy'
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        if: env.TF_ACTION == 'apply'
        run: |
          terraform apply -auto-approve tfplan
          echo "### 🚀 Outputs da Infraestrutura AWS (CNAMEs para ClouDNS)" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          terraform output -json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Terraform Destroy
        working-directory: terraform
        if: env.TF_ACTION == 'destroy'
        run: terraform destroy -auto-approve

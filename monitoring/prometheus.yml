global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "credit-guard-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "credit-scoring-observability-api"
          phase: "fase04"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
